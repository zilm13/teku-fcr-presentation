<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">FastConfirmationStates record fields</title>
  <desc id="description">FastConfirmationStates holds previousBalanceSource as Optional of BeaconState, currentBalanceSource as BeaconState, and pulledUpHeadState as BeaconState. Only the previous balance source is optional.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #24292e; }
    .name { font-size: 31px; font-weight: 700; text-anchor: middle; }
    .kind { font-size: 21px; text-anchor: end; fill: #59636d; }
    .field { font-family: "DejaVu Sans Mono", monospace; font-size: 28px; }
  </style>

  <rect x="50" y="20" width="1100" height="260" fill="#ffffff" stroke="#51616b" stroke-width="2"/>
  <rect x="51" y="21" width="1098" height="58" fill="#e0f1ec"/>
  <text class="name" x="600" y="61">FastConfirmationStates</text>
  <text class="kind" x="1125" y="58">record</text>
  <line x1="50" y1="79" x2="1150" y2="79" stroke="#51616b" stroke-width="1.5"/>

  <text class="field" x="80" y="130">- previousBalanceSource : Optional&lt;BeaconState&gt;</text>
  <text class="field" x="80" y="191">- currentBalanceSource : BeaconState</text>
  <text class="field" x="80" y="252">- pulledUpHeadState : BeaconState</text>
</svg>
