<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title description">
  <title id="title">Computed and reported confirmed roots</title>
  <desc id="description">The tracker stores the calculator result in FastConfirmationStore. After initial sync it derives a separate restart-resilient reported root. That root feeds the confirmation event, storage updates and the Beacon API. The slot pipeline separately uses it for the execution layer's safeBlockHash.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#49636a"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #24292e; text-anchor: middle; }
    .owner { font-size: 22px; font-weight: 700; }
    .method { font-family: "DejaVu Sans Mono", monospace; font-size: 23px; }
    .detail { font-size: 20px; }
    .edge { fill: none; stroke: #49636a; stroke-width: 2.5; marker-end: url(#arrow); }
    .node { fill: #f3f6f7; stroke: #627780; stroke-width: 1.7; }
  </style>

  <path class="edge" d="M540 60 H660"/>
  <text class="detail" x="600" y="45" style="font-size:18px">after sync</text>
  <path class="edge" d="M922 110 V142 H290 V172"/>
  <text class="detail" x="550" y="130" style="font-size:19px">event</text>
  <path class="edge" d="M922 110 V172"/>
  <text class="detail" x="1060" y="155" style="font-size:18px">pipeline completion</text>

  <path class="edge" d="M290 250 V265 H25 V313 H45"/>
  <path class="edge" d="M290 250 V265 H25 V401 H45"/>
  <path class="edge" d="M918 250 V302"/>

  <rect class="node" x="15" y="10" width="525" height="100" rx="3"/>
  <text class="owner" x="277" y="36" style="font-size:21px">FastConfirmationTracker</text>
  <text class="method" x="277" y="64">applyConfirmedRoot()</text>
  <text class="detail" x="277" y="91" style="font-size:19px">updates FastConfirmationStore.confirmedRoot</text>

  <rect x="660" y="10" width="525" height="100" rx="3" fill="#e0f1ec" stroke="#4a877b" stroke-width="1.7"/>
  <text class="owner" x="922" y="36">Reported root</text>
  <text class="method" x="922" y="64" style="font-size:22px">restoreConfirmedRootAfterRestart()</text>
  <text class="detail" x="922" y="91">restartResilientConfirmedRoot</text>

  <rect class="node" x="15" y="172" width="550" height="78" rx="3"/>
  <text class="owner" x="290" y="202">FastConfirmationEventChannel</text>
  <text class="method" x="290" y="232">onFastConfirmation()</text>

  <rect class="node" x="650" y="172" width="535" height="78" rx="3"/>
  <text class="owner" x="918" y="202">ForkChoiceStateProvider</text>
  <text class="method" x="918" y="232">getForkChoiceStateSync()</text>

  <rect class="node" x="45" y="282" width="520" height="62" rx="3"/>
  <text class="owner" x="305" y="307" style="font-size:21px">StoredFastConfirmedRootUpdater</text>
  <text class="detail" x="305" y="334">write only when the root changes</text>

  <rect class="node" x="45" y="370" width="520" height="62" rx="3"/>
  <text class="owner" x="305" y="396">EventSubscriptionManager</text>
  <text class="method" x="305" y="423" style="font-size:21px">fast_confirmation stream</text>

  <rect x="650" y="302" width="535" height="105" rx="3" fill="#e0f1ec" stroke="#4a877b" stroke-width="1.7"/>
  <text class="owner" x="918" y="333">Execution layer</text>
  <text class="method" x="918" y="363">engine_forkchoiceUpdated</text>
  <text class="method" x="918" y="391">safeBlockHash</text>
</svg>
